name: Build SUJ PROJECT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract SUJ Project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP tidak ditemukan"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cp -a "$PROJECT_DIR"/. .

      - name: Fix app Gradle file
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("app/build.gradle.kts tidak ditemukan")

          text = p.read_text()
          text = text.replace("\\n", "\n")
          p.write_text(text)

          print("File app/build.gradle.kts diperbaiki")
          PY
          
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUJ-PROJECT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error